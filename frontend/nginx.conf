server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A aplicação é uma SPA: qualquer rota desconhecida devolve o index.html
    # em vez de 404.
    location / {
        try_files $uri $uri/ /index.html;

        # O index.html é a única coisa que diz qual versão do sistema carregar:
        # ele aponta para os assets pelo nome com hash. Sem cabeçalho de cache
        # o navegador decide sozinho por quanto tempo guardá-lo, e enquanto
        # guardar ele continua pedindo os assets da versão antiga — que estão
        # no cache dele e respondem na hora. O resultado é o ateliê rodando
        # uma versão velha depois de uma subida de produção, sem nada na tela
        # que explique isso.
        #
        # "no-cache" não proíbe guardar: obriga a confirmar com o servidor
        # antes de usar. Na prática é um 304 por visita quando nada mudou, e a
        # versão nova entra sozinha quando mudou.
        add_header Cache-Control "no-cache";
    }

    # Os assets do Vite têm hash no nome, então podem ser cacheados para
    # sempre: versão nova é arquivo com nome novo, que o index.html novo pede.
    #
    # Um Cache-Control só, montado à mão: o `expires` do nginx escreve um
    # Cache-Control próprio, e junto com o add_header a resposta saía com dois
    # cabeçalhos de cache dizendo coisas diferentes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
