root = "."
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -o /tmp/air/server ./cmd/server"
  bin = "/tmp/air/server"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "data"]
  # No Windows o bind mount não emite eventos de arquivo, então o air precisa
  # verificar por polling.
  poll = true
  poll_interval = 500
  delay = 300
  stop_on_error = false

[log]
  time = true

[misc]
  clean_on_exit = true
